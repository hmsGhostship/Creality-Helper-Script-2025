# =========================================================================
# CREALITY CALIBRATION TOOLBOX (Universal-Version von hmsGhostship)
# =========================================================================

[save_variables]
filename: /usr/data/printer_data/config/variables.cfg

[gcode_macro _ORCA_CALIB_DATA]
variable_active: 0
gcode:

# =========================================================================
# INTERFAZ-TASTER (OFF -> ORIGINAL -> ADAPTIVE -> OFF)
# =========================================================================
[gcode_macro A_BED_MESH_CALIB]
description: Click to switch between Bed Mesh OFF, ORIGINAL (Full) or ADAPTIVE
gcode:
  {% set current_state = printer["gcode_macro _ORCA_CALIB_DATA"].active|int %}

  {% if current_state == 0 %}
    SET_GCODE_VARIABLE MACRO=_ORCA_CALIB_DATA VARIABLE=active VALUE=1
    SAVE_VARIABLE VARIABLE=orca_calib_state VALUE=1
    M117 🟩 Bed Mesh: ORIGINAL 🟩
    RESPOND MSG="CFS-C & Leveling: ORIGINAL (Full Bed Mesh) ENABLED"
    
#  {% elif current_state == 1 %}
#    SET_GCODE_VARIABLE MACRO=_ORCA_CALIB_DATA VARIABLE=active VALUE=2
#    SAVE_VARIABLE VARIABLE=orca_calib_state VALUE=2
#    M117 🟦 Bed Mesh: ADAPTIVE 🟦
#    RESPOND MSG="CFS-C & Leveling: NATIVE ADAPTIVE (Bed Mesh) ENABLED"
    
  {% else %}
    SET_GCODE_VARIABLE MACRO=_ORCA_CALIB_DATA VARIABLE=active VALUE=0
    SAVE_VARIABLE VARIABLE=orca_calib_state VALUE=0
    M117 🟥 Bed Mesh Calibration: OFF 🟥
    RESPOND MSG="CFS-C & Leveling: DISABLED"
  {% endif %}

# =========================================================================
# PROTECTIVE WALL (Schnittstelle zur Creality-Engine)
# =========================================================================
[gcode_macro SDCARD_PRINT_FILE]
rename_existing: SDCARD_PRINT_FILE_BASE
gcode:
  {% set calib_enabled = printer["gcode_macro _ORCA_CALIB_DATA"].active|int %}
  
  {% if 'ISCONTINUEPRINT' in rawparams or 'CALIBRATEMODE' in rawparams %}
    SDCARD_PRINT_FILE_BASE {rawparams}
  
  {% elif calib_enabled == 1 %}
    RESPOND MSG="OrcA-Druck startet: Kalibrierungs-Parameter aktiv!"
    SDCARD_PRINT_FILE_BASE {rawparams} ISCONTINUEPRINT=0 CALIBRATEMODE=1

  {% else %}
    {% if calib_enabled == 2 %}
      RESPOND MSG="OrcA-Druck startet: ADAPTIVE aktiv (Werks-Leveling umgangen)."
    {% else %}
      RESPOND MSG="OrcA-Druck startet: Keine Zusatzkalibrierung."
    {% endif %}
    SDCARD_PRINT_FILE_BASE {rawparams}
  {% endif %}

# =========================================================================
# BED_MESH INTERCEPTOR (Fehlersichere Klipper-Basis-Umlenkung)
# =========================================================================
[gcode_macro BED_MESH_CALIBRATE]
rename_existing: BED_MESH_CALIBRATE_BASE
gcode:
  {% set calib_enabled = printer["gcode_macro _ORCA_CALIB_DATA"].active|int %}
  
  # Wir prüfen stur, ob der Slicer uns fertige, glatte Werte mitgibt
  {% set mesh_min = params.MESH_MIN|default(none) %}
  {% set mesh_max = params.MESH_MAX|default(none) %}

  {% if calib_enabled == 2 and mesh_min is not none and mesh_max is not none %}
    RESPOND MSG="Toolbox: Slicer-Teilgitter aktiv -> MIN={mesh_min} MAX={mesh_max}"
    BED_MESH_CALIBRATE_BASE MESH_MIN={mesh_min} MESH_MAX={mesh_max}
  {% else %}
    # Fallback auf das normale Werkssystem, falls Zustand 0/1 aktiv ist oder keine Werte da sind
    BED_MESH_CALIBRATE_BASE {rawparams}
  {% endif %}

# =========================================================================
# BOOT-SYNC
# =========================================================================
[delayed_gcode _INIT_ORCA_CALIB_TEXT]
initial_duration: 2.0
gcode:
  {% set sv = printer.save_variables.variables %}
  {% set saved_state = sv.orca_calib_state|default(0)|int %}
  
  SET_GCODE_VARIABLE MACRO=_ORCA_CALIB_DATA VARIABLE=active VALUE={saved_state}
  
  {% if saved_state == 1 %}
    M117 🟩 Bed Mesh: ORIGINAL 🟩
    RESPOND MSG="Printer Booted - OrcA Calibration is ORIGINAL"
  {% elif saved_state == 2 %}
    M117 🟦 Bed Mesh: ADAPTIVE 🟦
    RESPOND MSG="Printer Booted - OrcA Calibration is NATIVE ADAPTIVE"
  {% else %}
    M117 🟥 Bed Mesh Calibration: OFF 🟥
    RESPOND MSG="Printer Booted - OrcA Calibration is OFF"
  {% endif %}