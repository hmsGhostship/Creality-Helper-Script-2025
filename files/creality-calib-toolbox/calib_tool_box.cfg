# =========================================================================
# CREALITY CALIBRATION TOOLBOX (Universal: Nexusp + Native Klipper + Slicer)
# =========================================================================

[save_variables]
filename: /usr/data/printer_data/config/variables.cfg

[gcode_macro _ORCA_CALIB_DATA]
variable_active: 0
variable_nexusp_active: 1
variable_sdcard_calib_sent: 0
gcode:

# =========================================================================
# DIRECT MODE SETTER (For Slicer Start G-Code: SET_CALIB_MODE MODE=OFF|FULL|ADAPTIVE)
# =========================================================================
[gcode_macro SET_CALIB_MODE]
description: Set Bed Mesh mode directly (MODE=OFF, FULL/ORIGINAL, or ADAPTIVE)
gcode:
  {% set mode = params.MODE|default("")|upper %}
  {% if mode in ["1", "FULL", "ORIGINAL", "ON"] %}
    SET_GCODE_VARIABLE MACRO=_ORCA_CALIB_DATA VARIABLE=active VALUE=1
    SET_GCODE_VARIABLE MACRO=A_BED_MESH_CALIB VARIABLE=status VALUE='"🟩 ORIGINAL"'
    SAVE_VARIABLE VARIABLE=orca_calib_state VALUE=1
    M117 🟩 Bed Mesh: ORIGINAL 🟩
    SET_DISPLAY_TEXT MSG="🟩 Bed Mesh: ORIGINAL 🟩"
    RESPOND MSG="🟩 Bed Mesh: ORIGINAL (Full Bed Mesh) ENABLED 🟩"
  {% elif mode in ["2", "ADAPTIVE", "KAMP"] %}
    SET_GCODE_VARIABLE MACRO=_ORCA_CALIB_DATA VARIABLE=active VALUE=2
    SET_GCODE_VARIABLE MACRO=A_BED_MESH_CALIB VARIABLE=status VALUE='"🟦 ADAPTIVE"'
    SAVE_VARIABLE VARIABLE=orca_calib_state VALUE=2
    M117 🟦 Bed Mesh: ADAPTIVE 🟦
    SET_DISPLAY_TEXT MSG="🟦 Bed Mesh: ADAPTIVE 🟦"
    RESPOND MSG="🟦 Bed Mesh: NATIVE ADAPTIVE (Bed Mesh) ENABLED 🟦"
  {% elif mode in ["0", "OFF", "NONE", "DISABLE"] %}
    SET_GCODE_VARIABLE MACRO=_ORCA_CALIB_DATA VARIABLE=active VALUE=0
    SET_GCODE_VARIABLE MACRO=A_BED_MESH_CALIB VARIABLE=status VALUE='"🟥 OFF"'
    SAVE_VARIABLE VARIABLE=orca_calib_state VALUE=0
    M117 🟥 Bed Mesh Calibration: OFF 🟥
    SET_DISPLAY_TEXT MSG="🟥 Bed Mesh Calibration: OFF 🟥"
    RESPOND MSG="🟥 Bed Mesh Calibration: DISABLED 🟥"
  {% else %}
    RESPOND MSG="Usage: SET_CALIB_MODE MODE=OFF | FULL | ADAPTIVE"
  {% endif %}

# =========================================================================
# INTERFACE BUTTON (OFF -> ORIGINAL -> ADAPTIVE -> OFF)
# =========================================================================
[gcode_macro A_BED_MESH_CALIB]
description: Click to switch between Bed Mesh OFF, ORIGINAL (Full) or ADAPTIVE
variable_status: "🟥 OFF"
gcode:
  {% set current_state = printer["gcode_macro _ORCA_CALIB_DATA"].active|int %}
  {% if current_state == 0 %}
    SET_CALIB_MODE MODE=ORIGINAL
  {% elif current_state == 1 %}
    SET_CALIB_MODE MODE=ADAPTIVE
  {% else %}
    SET_CALIB_MODE MODE=OFF
  {% endif %}

# =========================================================================
# PROTECTIVE WALL (Nexusp vs. Native Klipper Routing)
# =========================================================================
[gcode_macro SDCARD_PRINT_FILE]
rename_existing: SDCARD_PRINT_FILE_BASE
gcode:
  {% set calib_enabled = printer["gcode_macro _ORCA_CALIB_DATA"].active|int %}
  {% set has_nexusp = printer["gcode_macro _ORCA_CALIB_DATA"].nexusp_active|int %}
  SET_GCODE_VARIABLE MACRO=_ORCA_CALIB_DATA VARIABLE=sdcard_calib_sent VALUE=0

  {% if has_nexusp == 0 %}
    SDCARD_PRINT_FILE_BASE {rawparams}
  {% elif 'ISCONTINUEPRINT' in rawparams or 'CALIBRATEMODE' in rawparams %}
    SET_GCODE_VARIABLE MACRO=_ORCA_CALIB_DATA VARIABLE=sdcard_calib_sent VALUE=1
    SDCARD_PRINT_FILE_BASE {rawparams}
  {% elif calib_enabled == 1 %}
    SET_GCODE_VARIABLE MACRO=_ORCA_CALIB_DATA VARIABLE=sdcard_calib_sent VALUE=1
    RESPOND MSG="Orca Print Starting (Nexusp): ORIGINAL Full Bed Mesh (CALIBRATEMODE=1)!"
    SDCARD_PRINT_FILE_BASE {rawparams} ISCONTINUEPRINT=0 CALIBRATEMODE=1
  {% elif calib_enabled == 2 %}
    SET_GCODE_VARIABLE MACRO=_ORCA_CALIB_DATA VARIABLE=sdcard_calib_sent VALUE=1
    RESPOND MSG="Orca Print Starting (Nexusp): NATIVE ADAPTIVE Bed Mesh (CALIBRATEMODE=2)!"
    SDCARD_PRINT_FILE_BASE {rawparams} ISCONTINUEPRINT=0 CALIBRATEMODE=2
  {% else %}
    RESPOND MSG="Orca Print Starting: No additional calibration (OFF)."
    SDCARD_PRINT_FILE_BASE {rawparams}
  {% endif %}

[gcode_macro START_PRINT]
rename_existing: START_PRINT_BASE
gcode:
  {% set calib_enabled = printer["gcode_macro _ORCA_CALIB_DATA"].active|int %}
  {% set has_nexusp = printer["gcode_macro _ORCA_CALIB_DATA"].nexusp_active|int %}
  {% set sdcard_sent = printer["gcode_macro _ORCA_CALIB_DATA"].sdcard_calib_sent|int %}
  {% set slicer_mesh = params.MESH|default("")|upper %}

  {% set effective_mode = calib_enabled %}
  {% if slicer_mesh in ["0", "OFF", "NONE", "DISABLE"] %}
    {% set effective_mode = 0 %}
  {% elif slicer_mesh in ["1", "FULL", "ORIGINAL", "ON"] %}
    {% set effective_mode = 1 %}
  {% elif slicer_mesh in ["2", "ADAPTIVE", "KAMP"] %}
    {% set effective_mode = 2 %}

  {% endif %}

  # Run native Klipper bed mesh if nexusp did not already handle CALIBRATEMODE
  {% if (has_nexusp == 0 or sdcard_sent == 0) and effective_mode == 1 %}
    RESPOND MSG="Orca Print Starting: Running Native Full Bed Mesh..."
    {% if "xyz" not in printer.toolhead.homed_axes %}
      G28
    {% endif %}
    BED_MESH_CALIBRATE
  {% elif (has_nexusp == 0 or sdcard_sent == 0) and effective_mode == 2 %}
    RESPOND MSG="Orca Print Starting: Running Native Adaptive Bed Mesh..."
    {% if "xyz" not in printer.toolhead.homed_axes %}
      G28
    {% endif %}
    BED_MESH_CALIBRATE ADAPTIVE=1
  {% endif %}

  SET_GCODE_VARIABLE MACRO=_ORCA_CALIB_DATA VARIABLE=sdcard_calib_sent VALUE=0
  START_PRINT_BASE {rawparams}

# =========================================================================
# BOOT-SYNC
# =========================================================================
[delayed_gcode _INIT_ORCA_CALIB_TEXT]
initial_duration: 2.0
gcode:
  {% set sv = printer.save_variables.variables %}
  {% set saved_state = sv.orca_calib_state|default(0)|int %}
  {% set saved_nexusp = sv.nexusp_active|default(1)|int %}

  SET_GCODE_VARIABLE MACRO=_ORCA_CALIB_DATA VARIABLE=active VALUE={saved_state}
  SET_GCODE_VARIABLE MACRO=_ORCA_CALIB_DATA VARIABLE=nexusp_active VALUE={saved_nexusp}

  {% if saved_state == 1 %}
    SET_GCODE_VARIABLE MACRO=A_BED_MESH_CALIB VARIABLE=status VALUE='"🟩 ORIGINAL"'
    M117 🟩 Bed Mesh: ORIGINAL 🟩
    SET_DISPLAY_TEXT MSG="🟩 Bed Mesh: ORIGINAL 🟩"
    RESPOND MSG="🟩 Printer Booted - Orca Calibration is ORIGINAL (nexusp={saved_nexusp}) 🟩"
  {% elif saved_state == 2 %}
    SET_GCODE_VARIABLE MACRO=A_BED_MESH_CALIB VARIABLE=status VALUE='"🟦 ADAPTIVE"'
    M117 🟦 Bed Mesh: ADAPTIVE 🟦
    SET_DISPLAY_TEXT MSG="🟦 Bed Mesh: ADAPTIVE 🟦"
    RESPOND MSG="🟦 Printer Booted - Orca Calibration is NATIVE ADAPTIVE (nexusp={saved_nexusp}) 🟦"
  {% else %}
    SET_GCODE_VARIABLE MACRO=A_BED_MESH_CALIB VARIABLE=status VALUE='"🟥 OFF"'
    M117 🟥 Bed Mesh Calibration: OFF 🟥
    SET_DISPLAY_TEXT MSG="🟥 Bed Mesh Calibration: OFF 🟥"
    RESPOND MSG="🟥 Printer Booted - Orca Calibration is OFF (nexusp={saved_nexusp}) 🟥"
  {% endif %}
