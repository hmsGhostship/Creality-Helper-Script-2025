# =========================================================================
# UNIVERSAL KAMP-ONLY INTERFACE (Nutzt das globale hmsGhostship Datensystem)
# =========================================================================

# 1. Wir nutzen exakt dasselbe RAM-Gedächtnis wie deine Toolbox!
[gcode_macro _ORCA_CALIB_DATA]
variable_active: 0
gcode:

# 2. Der Taster schaltet stur zwischen KAMP (2) und AUS (0) um
[gcode_macro KAMP_TOGGLE]
description: Klick um KAMP Adaptives Bed Mesh AN oder AUS zu schalten
gcode:
  {% set current_state = printer["gcode_macro _ORCA_CALIB_DATA"].active|int %}
  
  {% if current_state == 0 %}
    # Wenn es AUS war, schalten wir KAMP (Zustand 2) ein
    SET_GCODE_VARIABLE MACRO=_ORCA_CALIB_DATA VARIABLE=active VALUE=2
    SAVE_VARIABLE VARIABLE=orca_calib_state VALUE=2
    M117 🟦 KAMP Mesh: AKTIV 🟦
    RESPOND MSG="KAMP Adaptives Bed Mesh: ENABLED"
  {% else %}
    # Wenn es an war (egal ob 1 oder 2), schalten wir es auf AUS (Zustand 0)
    SET_GCODE_VARIABLE MACRO=_ORCA_CALIB_DATA VARIABLE=active VALUE=0
    SAVE_VARIABLE VARIABLE=orca_calib_state VALUE=0
    M117 🟥 KAMP Mesh: DEAKTIVIERT 🟥
    RESPOND MSG="KAMP Adaptives Bed Mesh: DISABLED (Creality Full Mesh active)"
  {% endif %}

# 3. Klipper-Befehlsumlenkung (Fängt das Mesh ab & erzwingt den G-Code-Scan)
[gcode_macro BED_MESH_CALIBRATE]
rename_existing: BED_MESH_CALIBRATE_BASE
gcode:
  {% set calib_enabled = printer["gcode_macro _ORCA_CALIB_DATA"].active|int %}
  
  {% if calib_enabled == 2 %}
    RESPOND MSG="KAMP: Synchronisiere OrcaSlicer-Objektdaten im RAM..."
    
    # Zwingt Klipper, die Slicer-Daten JETZT aktiv in den RAM zu laden, bevor KAMP misst!
    EXCLUDE_OBJECT_DEFINE
    
    RESPOND MSG="KAMP: Starte adaptives Bed Mesh..."
    # Führt das verkleinerte native Klipper-Mesh mit den echten G-Code-Parametern aus
    BED_MESH_CALIBRATE_BASE {rawparams}
  {% else %}
    # KAMP ist aus (Zustand 0 oder 1): Fallback auf das originale Creality Full Bed Mesh
    RESPOND MSG="KAMP inaktiv: Starte originales Creality Full Bed Mesh..."
    CX_PRINT_LEVELING_CALIBRATION
  {% endif %}

# 4. Automatischer Boot-Sync (1:1 Kopie deines Toolbox-Verfahrens!)
[delayed_gcode _INIT_KAMP_ONLY_TEXT]
initial_duration: 2.0
gcode:
  {% set sv = printer.save_variables.variables %}
  
  # Holt den Zustand sicher von der Platte (Standard: 2 = KAMP aktiv nach Installation)
  {% set saved_state = sv.orca_calib_state|default(2)|int %}
  
  # Boot-Schutz: Wenn Zustand 1 (Original-Mesh) hinterlegt ist, KAMP-Only aber solo läuft,
  # schalten wir zur Sicherheit auf KAMP (2) um
  {% if saved_state == 1 %}
    {% set saved_state = 2 %}
    SAVE_VARIABLE VARIABLE=orca_calib_state VALUE=2
  {% endif %}
  
  # Synchronisiert die RAM-Variable sofort mit dem echten Wert von der Platte
  SET_GCODE_VARIABLE MACRO=_ORCA_CALIB_DATA VARIABLE=active VALUE={saved_state}
  
  # Aktualisiert die Mainsail-M117 Kachel passend zum Boot-Wert
  {% if saved_state == 2 %}
    M117 🟦 KAMP Mesh: AKTIV 🟦
    RESPOND MSG="Printer Booted - KAMP Adaptive Bed Mesh is ACTIVE"
  {% else %}
    M117 🟥 KAMP Mesh: DEAKTIVIERT 🟥
    RESPOND MSG="Printer Booted - KAMP Adaptive Bed Mesh is OFF"
  {% endif %}