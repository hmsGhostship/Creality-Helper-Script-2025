# Timelapse klipper macro definition
# Optimized for K1C CFS Hardware Native Timer 2026
# Macro version 2.2 - Clean UI International Build

[gcode_macro GET_TIMELAPSE_SETUP]
description: Displays the current timelapse setup in the console
gcode: 
  {% set tl = printer['gcode_macro TIMELAPSE_TAKE_FRAME'] %}
  {% set output_txt = ["Timelapse Setup:"] %}
  {% set _dummy = output_txt.append("enable: %s" % tl.enable) %}
  {% set _dummy = output_txt.append("park: %s" % tl.park.enable) %}
  {% if tl.park.enable %}
    {% set _dummy = output_txt.append("park position: %s time: %s s" % (tl.park.pos, tl.park.time)) %}
    {% set _dummy = output_txt.append("park cord x:%s y:%s dz:%s" % (tl.park.coord.x, tl.park.coord.y, tl.park.coord.dz)) %}
    {% set _dummy = output_txt.append("travel speed: %s mm/s" % tl.speed.travel) %}
  {% endif %}
  {% set _dummy = output_txt.append("fw_retract: %s" % tl.extruder.fw_retract) %}
  {% if not tl.extruder.fw_retract %}
    {% set _dummy = output_txt.append("retract: %s mm speed: %s mm/s" % (tl.extruder.retract, tl.speed.retract)) %}
    {% set _dummy = output_txt.append("extrude: %s mm speed: %s mm/s" % (tl.extruder.extrude, tl.speed.extrude)) %}
  {% endif %}
  {% set _dummy = output_txt.append("verbose: %s" % tl.verbose) %}
  {action_respond_info(output_txt|join("\n"))}

[gcode_macro _SET_TIMELAPSE_SETUP]
description: Internal function for parameter modifications
gcode:
  {% set tl = printer['gcode_macro TIMELAPSE_TAKE_FRAME'] %}
  {% set min = printer.toolhead.axis_minimum %}
  {% set max = printer.toolhead.axis_maximum %}
  {% set round_bed = True if printer.configfile.settings.printer.kinematics is in ['delta','polar','rotary_delta','winch'] else False %}
  {% set park = {'min'   : {'x': (min.x / 1.42)|round(3) if round_bed else min.x|round(3),
                            'y': (min.y / 1.42)|round(3) if round_bed else min.y|round(3)},
                 'max'   : {'x': (max.x / 1.42)|round(3) if round_bed else max.x|round(3),
                            'y': (max.y / 1.42)|round(3) if round_bed else max.y|round(3)},
                 'center': {'x': (max.x-(max.x-min.x)/2)|round(3),
                            'y': (max.y-(max.y-min.y)/2)|round(3)}} %}
  {% if params.ENABLE %}
    {% if params.ENABLE|lower is in ['true', 'false'] %}
      SET_GCODE_VARIABLE MACRO=TIMELAPSE_TAKE_FRAME VARIABLE=enable VALUE={True if params.ENABLE|lower == 'true' else False}
    {% else %}
      {action_raise_error("ENABLE=%s not supported. Allowed values are [True, False]" % params.ENABLE|capitalize)}
    {% endif %}
  {% endif %}
  
[gcode_macro TIMELAPSE_TAKE_FRAME]
description: Captures a single timelapse frame
variable_enable: False
variable_takingframe: False
variable_park: {'enable': False, 'pos': 'center', 'time': 0.1, 'custom': {'x': 0, 'y': 0, 'dz': 0}, 'coord': {'x': 0, 'y': 0, 'dz': 0}}
variable_extruder: {'fw_retract': False, 'retract': 1.0, 'extrude': 1.0}
variable_speed: {'travel': 100, 'retract': 15, 'extrude': 15}
variable_verbose: True
variable_check_time: 0.5
variable_restore: {'absolute': {'coordinates': True, 'extrude': True}, 'speed': 1500, 'e':0, 'factor': {'speed': 1.0, 'extrude': 1.0}}
variable_macro: {'pause': 'PAUSE', 'resume': 'RESUME'}
variable_is_paused: False
variable_render: False
gcode:
  {% set hyperlapse = True if params.HYPERLAPSE and params.HYPERLAPSE|lower =='true' else False %}
  {% if enable %}
    {% if park.enable %}
      {% set pos = {'x': 'X' + park.coord.x|string if park.pos != 'y_only' else '',
                    'y': 'Y' + park.coord.y|string if park.pos != 'x_only' else '',
                    'z': 'Z'+ [printer.gcode_move.gcode_position.z + park.coord.dz, printer.toolhead.axis_maximum.z]|min|string} %}
      {% set restore = {'absolute': {'coordinates': printer.gcode_move.absolute_coordinates, 'extrude': printer.gcode_move.absolute_extrude},
                        'speed'   : printer.gcode_move.speed, 'e': printer.gcode_move.gcode_position.e,
                        'factor'  : {'speed': printer.gcode_move.speed_factor, 'extrude': printer.gcode_move.extrude_factor}} %}
      SET_GCODE_VARIABLE MACRO=TIMELAPSE_TAKE_FRAME VARIABLE=restore VALUE="{restore}"
      {% if not printer[printer.toolhead.extruder].can_extrude %}
        {% if verbose %}{action_respond_info("Timelapse: Warning, minimum extruder temperature not reached!")}{% endif %}
      {% else %}
        {% if extruder.fw_retract %}
          G10
        {% else %}
          M83
          G0 E-{extruder.retract} F{speed.retract * 60}
        {% endif %}
      {% endif %}
      SET_GCODE_VARIABLE MACRO=TIMELAPSE_TAKE_FRAME VARIABLE=is_paused VALUE=True
      {macro.pause}
      SET_GCODE_OFFSET X=0 Y=0
      G90
      {% if "xyz" not in printer.toolhead.homed_axes %}
        {% if verbose %}{action_respond_info("Timelapse: Warning, axis not homed yet!")}{% endif %}
      {% else %}
        G0 {pos.x} {pos.y} {pos.z} F{speed.travel * 60}
      {% endif %}
      SET_GCODE_VARIABLE MACRO=TIMELAPSE_TAKE_FRAME VARIABLE=takingframe VALUE=True
      UPDATE_DELAYED_GCODE ID=_WAIT_TIMELAPSE_TAKE_FRAME DURATION={check_time}
      M400
    {% endif %}
    _TIMELAPSE_NEW_FRAME HYPERLAPSE={hyperlapse}
  {% else %}
    {% if verbose %}{action_respond_info("Timelapse: disabled, take frame ignored")}{% endif %}
  {% endif %}

[delayed_gcode _WAIT_TIMELAPSE_TAKE_FRAME]
gcode:
  {% set tl = printer['gcode_macro TIMELAPSE_TAKE_FRAME'] %}
  {% set factor = {'speed': printer.gcode_move.speed_factor, 'extrude': printer.gcode_move.extrude_factor} %}
  {% if tl.takingframe %}
    UPDATE_DELAYED_GCODE ID=_WAIT_TIMELAPSE_TAKE_FRAME DURATION={tl.check_time}
  {% else %}
    {tl.macro.resume} VELOCITY={tl.speed.travel}
    SET_GCODE_VARIABLE MACRO=TIMELAPSE_TAKE_FRAME VARIABLE=is_paused VALUE=False
    {% if not printer[printer.toolhead.extruder].can_extrude %}
      {action_respond_info("Timelapse: Warning, minimum extruder temperature not reached!")}
    {% else %}
      {% if tl.extruder.fw_retract %}
        G11
      {% else %}
        G0 E{tl.extruder.extrude} F{tl.speed.extrude * 60}
        G0 F{tl.restore.speed}
        {% if tl.restore.absolute.extrude %}
          M82
          G92 E{tl.restore.e}
        {% endif %}
      {% endif %}
    {% endif %}
    {% if tl.restore.factor.speed   != factor.speed   %} M220 S{(factor.speed*100)|round(0)}   {% endif %}
    {% if tl.restore.factor.extrude != factor.extrude %} M221 S{(factor.extrude*100)|round(0)} {% endif %}
    {% if not tl.restore.absolute.coordinates %} G91 {% endif %}
  {% endif %}

[gcode_macro _TIMELAPSE_NEW_FRAME]
description: Internal remote method call for camera snapshot
gcode:
  {action_call_remote_method("timelapse_newframe", macropark=printer['gcode_macro TIMELAPSE_TAKE_FRAME'].park, hyperlapse=params.HYPERLAPSE)}

[gcode_shell_command NATIVE_RENDER]
command: sh -c "FILENAME=/usr/data/printer_data/timelapse/k1c-$$.mp4; /opt/bin/ffmpeg -r 5 -pattern_type glob -i '/usr/data/printer_data/frames/frame*.jpg' -c:v libx264 -profile:v baseline -level 3.0 -pix_fmt yuv420p -preset superfast -y $FILENAME && rm -f /usr/data/printer_data/frames/frame*.jpg"
timeout: 600.0
verbose: true

[gcode_macro TIMELAPSE_RENDER]
description: Renders the timelapse video using hardware-compatible Entware FFmpeg
variable_render: False
gcode:
  {action_respond_info("Timelapse: Starting native hardware-optimized FFmpeg rendering process...")}
  RUN_SHELL_COMMAND CMD=NATIVE_RENDER

[gcode_macro TEST_STREAM_DELAY]
description: Helper macro to determine stream and park delay
gcode:
  {% set min = printer.toolhead.axis_minimum %}
  {% set max = printer.toolhead.axis_maximum %}
  {% set act = printer.toolhead.position %}
  {% set tl = printer['gcode_macro TIMELAPSE_TAKE_FRAME'] %}
  {% if act.z > 5.0 %}
    G0 X{min.x + 5.0} F{tl.speed.travel|int * 60}
    G0 X{(max.x-min.x)/2}
    G4 P{tl.park.time|float * 1000}
    _TIMELAPSE_NEW_FRAME HYPERLAPSE=FALSE
    G0 X{max.x - 5.0}
  {% else %}
    {action_raise_error("Toolhead Z %.3f too low. Please place head above Z = 5.0" % act.z)}
  {% endif %}

# ====================================================================
# NATIVE COMPONENT CONTROL DASHBOARD BUTTONS (100% UI MACROS)
# ====================================================================

[gcode_macro HYPERLAPSE]
description: Time-based hyperlapse (CYCLE=30 for 30s interval, CYCLE=0 to STOP)
variable_cycle: 0
variable_active: 0
gcode:
  {% set s = params.CYCLE|default(0)|int %}
  SET_GCODE_VARIABLE MACRO=HYPERLAPSE VARIABLE=cycle VALUE={s}
  
  {% if s == 0 %}
    {action_respond_info("Hyperlapse: Time-based timer stopped.")}
    SET_GCODE_VARIABLE MACRO=HYPERLAPSE VARIABLE=active VALUE=0
    UPDATE_DELAYED_GCODE ID=_KLIPPER_HYPERLAPSE_LOOP DURATION=0
  {% else %}
    {action_respond_info("Hyperlapse: Time-based timer active! Intervalling every %d seconds." % s)}
    SET_GCODE_VARIABLE MACRO=HYPERLAPSE VARIABLE=active VALUE=1
    UPDATE_DELAYED_GCODE ID=_KLIPPER_HYPERLAPSE_LOOP DURATION=1
  {% endif %}

[delayed_gcode _KLIPPER_HYPERLAPSE_LOOP]
gcode:
  {% set item = printer["gcode_macro HYPERLAPSE"] %}
  {% if item.active|int == 1 and item.cycle|int > 0 %}
    {% if printer.print_stats.state|lower == "printing" %}
      {action_call_remote_method("timelapse_newframe", macropark=printer['gcode_macro TIMELAPSE_TAKE_FRAME'].park, hyperlapse=True)}
    {% endif %}
    UPDATE_DELAYED_GCODE ID=_KLIPPER_HYPERLAPSE_LOOP DURATION={item.cycle|int}
  {% endif %}

[gcode_macro TIMELAPSE_LAYER_CONTROL]
description: Toggles layer change snapshot execution (Default on first click is ON)
variable_layer_status: 0
gcode:
  {% set current = printer['gcode_macro TIMELAPSE_LAYER_CONTROL'].layer_status|int %}
  
  {% if current == 0 %}
    # -> 1st CLICK AFTER BOOT: Forces the system to ENABLED!
    SET_GCODE_VARIABLE MACRO=TIMELAPSE_LAYER_CONTROL VARIABLE=layer_status VALUE=1
    SET_GCODE_VARIABLE MACRO=TIMELAPSE_TAKE_FRAME VARIABLE=enable VALUE=True
    {action_respond_info("Timelapse: Layer changing snapshots 🟩 ENABLED 🟩")}
  {% else %}
    # -> 2nd CLICK: Disables the execution channel again
    SET_GCODE_VARIABLE MACRO=TIMELAPSE_LAYER_CONTROL VARIABLE=layer_status VALUE=0
    SET_GCODE_VARIABLE MACRO=TIMELAPSE_TAKE_FRAME VARIABLE=enable VALUE=False
    {action_respond_info("Timelapse: Layer changing snapshots 🟥 DISABLED 🟥")}
  {% endif %}

# ====================================================================
# AUTOMATIC BOOT SHUTDOWN (Ensures safe default state: OFF)
# ====================================================================
[delayed_gcode _TIMELAPSE_BOOT_SHUTDOWN]
initial_duration: 5.0
gcode:
  # Forces the snapshot execution engine to a safe shutdown state after boot
  SET_GCODE_VARIABLE MACRO=TIMELAPSE_TAKE_FRAME VARIABLE=enable VALUE=False
  SET_GCODE_VARIABLE MACRO=TIMELAPSE_LAYER_CONTROL VARIABLE=layer_status VALUE=0
  UPDATE_DELAYED_GCODE ID=_TIMELAPSE_BOOT_SHUTDOWN DURATION=0
