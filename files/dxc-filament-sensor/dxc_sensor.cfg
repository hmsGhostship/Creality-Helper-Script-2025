[filament_switch_sensor filament_sensor]
pause_on_runout: true
switch_pin: !nozzle_mcu:PB9
event_delay: 1.5
pause_delay: 0.25
insert_gcode: 
  M118 Filament inserted
runout_gcode:
  {action_respond_info("DXC Extruder runout")}
  {% if printer.extruder.can_extrude|lower == 'true' %}
    G91
    G0 E30 F600
    G90
  {% endif %}
