# ====================================================================
# MULTI-OS PROZESSSICHERER INTERLOCK: TOOLHEAD SENSOR (DXC / EXTRUDER) + MELLOW LLL PLUS
# ====================================================================

[filament_switch_sensor lll_plus_sensor]
pause_on_runout: False
switch_pin: ^PD7
runout_gcode:
    RESPOND MSG="Matrix-Info: LLL Plus Buffer -> EMPTY"
    {% if printer.print_stats.state == "printing" %}
        RESPOND TYPE=error MSG="⚠️ External Spool (FLY-LLL Plus) RUNOUT during print! Pausing print..."
        PAUSE
    {% elif printer.idle_timeout.state != "Printing" and printer.print_stats.state != "paused" and "gcode_macro NEXUSP_ON_CFS" in printer %}
        UPDATE_DELAYED_GCODE ID=_LLL_AUTO_REENABLE_NEXUSP DURATION=2.0
    {% endif %}
insert_gcode:
    RESPOND MSG="Matrix-Info: LLL Plus Buffer -> LOADED"
    {% if printer.idle_timeout.state != "Printing" and "gcode_macro NEXUSP_OFF_EXTERNAL_SPOOL" in printer %}
        {% set t1_fil = printer.box.T1.filament|string if ("box" in printer and "T1" in printer.box and "filament" in printer.box.T1) else "None" %}
        {% set cfs_loaded = (t1_fil != "None" and t1_fil != "" and t1_fil != "null") %}
        {% if printer["filament_switch_sensor filament_sensor"].filament_detected and cfs_loaded %}
            RESPOND TYPE=error MSG="⚠️ COLLISION WARNING: CFS-C filament is still loaded in extruder! Remove LLL Plus filament first!"
            {% if "gcode_macro BEEP" in printer %}
                BEEP
                BEEP
            {% endif %}
        {% else %}
            RESPOND MSG="🔄 FLY-LLL Plus inserted & extruder empty -> Auto-switching to External Spool mode..."
            NEXUSP_OFF_EXTERNAL_SPOOL
        {% endif %}
    {% endif %}

[gcode_macro _CHECK_LLL_SAFETY_MATRIX]
gcode:
    QUERY_FILAMENT_SENSOR SENSOR=filament_sensor
    QUERY_FILAMENT_SENSOR SENSOR=lll_plus_sensor
    G4 P100
    {% set t1_fil = printer.box.T1.filament|string if ("box" in printer and "T1" in printer.box and "filament" in printer.box.T1) else "None" %}
    {% set cfs_loaded = (t1_fil != "None" and t1_fil != "" and t1_fil != "null") %}
    {% if printer["filament_switch_sensor lll_plus_sensor"].filament_detected and cfs_loaded %}
        {action_raise_error("🚨 CRASH PROTECTION: External filament (LLL Plus) AND CFS-C slot are active! Remove one before printing!")}
    {% elif printer["filament_switch_sensor lll_plus_sensor"].filament_detected %}
        RESPOND MSG="✅ Matrix Check: External Spool Mode (FLY-LLL Plus) active -> Bypassing CFS-C."
    {% else %}
        RESPOND MSG="✅ Matrix Check: CFS-C mode clear. Print cleared."
    {% endif %}

[gcode_macro BOX_ENABLE_CFS_PRINT]
rename_existing: BOX_ENABLE_CFS_PRINT_BASE
gcode:
    {% if printer["filament_switch_sensor lll_plus_sensor"].filament_detected %}
        RESPOND MSG="🧵 FLY-LLL Plus active -> Forcing BOX_ENABLE_CFS_PRINT ENABLE=0"
        BOX_ENABLE_CFS_PRINT_BASE ENABLE=0
    {% else %}
        BOX_ENABLE_CFS_PRINT_BASE {rawparams}
    {% endif %}

[gcode_macro BOX_MODIFY_TN]
rename_existing: BOX_MODIFY_TN_BASE
gcode:
    {% if printer["filament_switch_sensor lll_plus_sensor"].filament_detected %}
        RESPOND MSG="🧵 FLY-LLL Plus active -> Skipping BOX_MODIFY_TN mapping"
    {% else %}
        BOX_MODIFY_TN_BASE {rawparams}
    {% endif %}





[delayed_gcode _LLL_AUTO_REENABLE_NEXUSP]
initial_duration: 0
gcode:
    QUERY_FILAMENT_SENSOR SENSOR=lll_plus_sensor
    QUERY_FILAMENT_SENSOR SENSOR=filament_sensor
    G4 P150
    {% if printer.idle_timeout.state == "Printing" or printer.print_stats.state == "paused" %}
        RESPOND MSG="ℹ️ Auto-CFS skipped: Print is active or paused."
    {% elif printer["filament_switch_sensor lll_plus_sensor"].filament_detected %}
        RESPOND MSG="ℹ️ Auto-CFS skipped: FLY-LLL Plus switch is occupied again."
    {% elif printer["filament_switch_sensor filament_sensor"].filament_detected %}
        RESPOND TYPE=error MSG="⚠️ Auto-CFS BLOCKED: Extruder filament sensor is still triggered! Remove remaining filament from Y-splitter/extruder first."
    {% else %}
        RESPOND MSG="📦 FLY-LLL Plus emptied & extruder verified empty -> Auto-reactivating nexusp (CFS-C)..."
        NEXUSP_ON_CFS
    {% endif %}

[gcode_macro _LLL_WATCHER_STATE]
variable_prev: -1
gcode:

[delayed_gcode _LLL_IDLE_SWITCH_WATCHER]
initial_duration: 2.0
gcode:
    {% if printer.idle_timeout.state != "Printing" and printer.print_stats.state != "paused" and "gcode_macro NEXUSP_ON_CFS" in printer %}
        {% set cur = 1 if printer["filament_switch_sensor lll_plus_sensor"].filament_detected else 0 %}
        {% set prev = printer["gcode_macro _LLL_WATCHER_STATE"].prev|int %}
        {% if prev != cur %}
            SET_GCODE_VARIABLE MACRO=_LLL_WATCHER_STATE VARIABLE=prev VALUE={cur}
            {% if prev == 1 and cur == 0 %}
                RESPOND MSG="Matrix-Info: LLL Plus Buffer -> EMPTY (Idle)"
                UPDATE_DELAYED_GCODE ID=_LLL_AUTO_REENABLE_NEXUSP DURATION=2.0
            {% endif %}
        {% endif %}
        UPDATE_DELAYED_GCODE ID=_LLL_IDLE_SWITCH_WATCHER DURATION=1.0
    {% else %}
        UPDATE_DELAYED_GCODE ID=_LLL_IDLE_SWITCH_WATCHER DURATION=3.0
    {% endif %}
