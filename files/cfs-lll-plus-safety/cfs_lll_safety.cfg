# ====================================================================
# MULTI-OS PROZESSSICHERER INTERLOCK: PHAETUS DXC + MELLOW LLL PLUS
# ====================================================================

[filament_switch_sensor lll_plus_sensor]
pause_on_runout: False
switch_pin: ^PD7
runout_gcode:
    RESPOND MSG="Matrix-Info: LLL Plus Buffer -> EMPTY"
insert_gcode:
    RESPOND MSG="Matrix-Info: LLL Plus Buffer -> LOADED"
    {% if printer.idle_timeout.state != "Printing" and "gcode_macro NEXUSP_OFF_EXTERNAL_SPOOL" in printer %}
        {% set t1_fil = printer.box.T1.filament|string if ("box" in printer and "T1" in printer.box and "filament" in printer.box.T1) else "None" %}
        {% set cfs_loaded = (t1_fil != "None" and t1_fil != "" and t1_fil != "null") %}
        {% if printer["filament_switch_sensor filament_sensor"].filament_detected and cfs_loaded %}
            RESPOND TYPE=error MSG="⚠️ COLLISION WARNING: CFS-C filament is still loaded in extruder! Remove LLL Plus filament and run NEXUSP_OFF_EXTERNAL_SPOOL first!"
            {% if "gcode_macro BEEP" in printer %}
                BEEP
                BEEP
            {% endif %}
        {% else %}
            RESPOND MSG="🔄 FLY-LLL Plus inserted & extruder empty -> Auto-switching to External Spool mode..."
            NEXUSP_OFF_EXTERNAL_SPOOL
        {% endif %}
    {% endif %}

# THIS MACRO HOOKS DIRECTLY INTO PRINT START
[gcode_macro _CHECK_LLL_SAFETY_MATRIX]
gcode:
    # Force live query to refresh RAM with real hardware sensor states
    QUERY_FILAMENT_SENSOR SENSOR=filament_sensor
    QUERY_FILAMENT_SENSOR SENSOR=lll_plus_sensor
    G4 P100
    
    # MATRIX STATE 1: Filament in extruder AND in LLL Plus (side-spool mode)
    {% if printer["filament_switch_sensor filament_sensor"].filament_detected and printer["filament_switch_sensor lll_plus_sensor"].filament_detected %}
        
        # Immediate abort of the print job BEFORE CFS-C is triggered!
        {action_raise_error("🚨 CRASH PROTECTION: External filament (LLL Plus) is blocking the extruder! CFS print blocked!")}
        
    {% else %}
        RESPOND MSG="✅ Matrix Check: No filament conflicts detected. Print cleared."
    {% endif %}
