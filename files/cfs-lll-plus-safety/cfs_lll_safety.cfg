# ====================================================================
# MULTI-OS PROZESSSICHERER INTERLOCK: PHAETUS DXC + MELLOW LLL PLUS
# ====================================================================

[filament_switch_sensor lll_plus_sensor]
pause_on_runout: False
switch_pin: ^PD7
runout_gcode:
    RESPOND MSG="Matrix-Info: LLL Plus Puffer -> LEER"
insert_gcode:
    RESPOND MSG="Matrix-Info: LLL Plus Puffer -> BELEGT"

# DIESES MAKRO KLINKT SICH DIREKT IN DEN DRUCKSTART EIN
[gcode_macro _CHECK_LLL_SAFETY_MATRIX]
gcode:
    # Live-Query erzwingen, um den RAM frisch mit den echten Hardware-Werten zu fluten
    QUERY_FILAMENT_SENSOR SENSOR=filament_sensor
    QUERY_FILAMENT_SENSOR SENSOR=lll_plus_sensor
    G4 P100
    
    # MATRIX-ZUSTAND 1: Filament im Kopf UND im LLL Plus (Seiten-Betrieb)
    {% if printer["filament_switch_sensor filament_sensor"].filament_detected and printer["filament_switch_sensor lll_plus_sensor"].filament_detected %}
        
        # Unwiderruflicher Abbruch des Druckauftrags, BEVOR das CFS-C angesteuert wird!
        {action_raise_error("🚨 CRASH-SCHUTZ: Externes Filament (LLL Plus) blockiert den Extruder! CFS-Druck blockiert!")}
        
    {% else %}
        RESPOND MSG="✅ Matrix-Check: Keine Filament-Konflikte. Druck freigegeben."
    {% endif %}
