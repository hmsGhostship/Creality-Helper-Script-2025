# ====================================================================
# FLY-LLL PLUS EXTERNAL BUFFER / RUNOUT SENSOR (K1_2025 NON-CFS)
# Requires Phaetus DXC Extruder (frees pin ^PD7 on toolhead board)
# ====================================================================

[filament_switch_sensor lll_plus_sensor]
pause_on_runout: False
switch_pin: ^PD7
runout_gcode:
    RESPOND MSG="FLY-LLL Plus (PD7): Spool empty / runout detected!"
    {% if printer.print_stats.state == "printing" %}
        PAUSE
    {% endif %}
insert_gcode:
    RESPOND MSG="FLY-LLL Plus (PD7): Filament inserted."
