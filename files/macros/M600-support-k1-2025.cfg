########################################
# M600 Support (K1C 2025 / CFS-C / DXC Compatible)
########################################

[respond]

[gcode_macro _M600_UNLOAD]
gcode:
  {% set target_temp = printer["gcode_macro M600"].hotend_temp|int %}
  {% if target_temp < 180 %}
    {% set target_temp = 220 %}
  {% endif %}
  RESPOND TYPE=command MSG="Heating hotend to {target_temp}C for filament unload..."
  M109 S{target_temp}
  RESPOND TYPE=command MSG="Unloading filament..."
  M83
  G1 E10 F300
  G1 E-15 F3000
  G1 E-25 F2400
  G1 E-25 F1200
  M400
  G90

[gcode_macro _M600_LOAD]
gcode:
  {% set target_temp = printer["gcode_macro M600"].hotend_temp|int %}
  {% if target_temp < 180 %}
    {% set target_temp = 220 %}
  {% endif %}
  RESPOND TYPE=command MSG="Heating hotend to {target_temp}C for filament load..."
  M109 S{target_temp}
  RESPOND TYPE=command MSG="Loading filament..."
  M83
  G1 E80 F240
  M400
  G90

[gcode_macro _M600_PURGE]
gcode:
  {% set target_temp = printer["gcode_macro M600"].hotend_temp|int %}
  {% if target_temp < 180 %}
    {% set target_temp = 220 %}
  {% endif %}
  M109 S{target_temp}
  RESPOND TYPE=command MSG="Purging filament..."
  M83
  G1 E15 F180
  M400
  G90

[gcode_macro M600]
description: Filament Change (K1C 2025)
variable_m600_state: 0
variable_hotend_temp: 0
variable_fan0_speed: 0
variable_fan2_speed: 0
gcode:
  {% set x_park = params.X|default(printer.toolhead.axis_maximum.x|float - 10.0)|float %}
  {% set y_park = params.Y|default(printer.toolhead.axis_minimum.y|float + 10.0)|float %}
  {% set z_lift = params.Z|default(15.0)|float %}
  {% set max_z = printer.toolhead.axis_maximum.z|float %}
  {% set act_z = printer.toolhead.position.z|float %}
  {% set z_safe = [z_lift, max_z - act_z]|min %}
  SET_GCODE_VARIABLE MACRO=M600 VARIABLE=m600_state VALUE=1
  SET_GCODE_VARIABLE MACRO=M600 VARIABLE=hotend_temp VALUE={printer.extruder.target|int}
  {% if "output_pin fan0" in printer %}
    SET_GCODE_VARIABLE MACRO=M600 VARIABLE=fan0_speed VALUE={printer["output_pin fan0"].value|float}
  {% endif %}
  {% if "output_pin fan2" in printer %}
    SET_GCODE_VARIABLE MACRO=M600 VARIABLE=fan2_speed VALUE={printer["output_pin fan2"].value|float}
  {% endif %}
  RESPOND TYPE=command MSG="Print paused for filament change (M600)!"
  {% if "xy" not in printer.toolhead.homed_axes %}
    G28 X Y
  {% endif %}
  PAUSE
  {% if "xyz" in printer.toolhead.homed_axes %}
    G91
    {% if printer.extruder.can_extrude|lower == "true" %}
      G1 E-2.0 F1800
    {% endif %}
    G1 Z{z_safe} F600
    G90
    G1 X{x_park} Y{y_park} F18000
    M400
  {% endif %}
  M106 P0 S0
  {% if "output_pin fan2" in printer %}
    M106 P2 S0
  {% endif %}
  SET_IDLE_TIMEOUT TIMEOUT=1800
  RESPOND TYPE=command MSG="action:prompt_begin Filament Change (M600)"
  RESPOND TYPE=command MSG="action:prompt_text Swap filament, load/purge until clean, then press RESUME PRINT."
  RESPOND TYPE=command MSG="action:prompt_button UNLOAD FILAMENT|_M600_UNLOAD|secondary"
  RESPOND TYPE=command MSG="action:prompt_button LOAD FILAMENT|_M600_LOAD|secondary"
  RESPOND TYPE=command MSG="action:prompt_button PURGE MORE|_M600_PURGE|secondary"
  RESPOND TYPE=command MSG="action:prompt_footer_button CANCEL PRINT|CANCEL_PRINT|error"
  RESPOND TYPE=command MSG="action:prompt_footer_button RESUME PRINT|M600_RESUME|primary"
  RESPOND TYPE=command MSG="action:prompt_show"

[gcode_macro M600_RESUME]
description: Resume print after M600 filament change
gcode:
  {% set target_temp = printer["gcode_macro M600"].hotend_temp|int %}
  {% if target_temp > 0 %}
    RESPOND TYPE=command MSG="Restoring hotend temperature to {target_temp}C..."
    M109 S{target_temp}
  {% endif %}
  {% set f0 = printer["gcode_macro M600"].fan0_speed|float %}
  {% if f0 > 0 %}
    M106 P0 S{(f0 * 255)|int}
  {% endif %}
  {% set f2 = printer["gcode_macro M600"].fan2_speed|float %}
  {% if f2 > 0 and "output_pin fan2" in printer %}
    M106 P2 S{(f2 * 255)|int}
  {% endif %}
  SET_GCODE_VARIABLE MACRO=M600 VARIABLE=m600_state VALUE=0
  SET_GCODE_VARIABLE MACRO=M600 VARIABLE=hotend_temp VALUE=0
  RESPOND TYPE=command MSG="action:prompt_end"
  RESPOND TYPE=command MSG="Resuming print after M600..."
  RESUME
