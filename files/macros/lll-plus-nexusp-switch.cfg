###############################################################
# FLY-LLL Plus (PD7) Auto-Switch & Manual Nexusp Backend Control
###############################################################

[filament_switch_sensor lll_plus_sensor]
pause_on_runout: False
switch_pin: !PD7

[gcode_shell_command nexusp_switch_cmd]
command: sh /usr/data/helper-script/scripts/lll_nexusp_guard.sh
timeout: 15.0
verbose: True

[gcode_macro NEXUSP_OFF_EXTERNAL_SPOOL]
description: Pause Creality nexusp backend to print from external spool (FLY-LLL Plus)
gcode:
  {% if printer.idle_timeout.state == "Printing" %}
    {action_raise_error("Cannot switch nexusp while a print is active!")}
  {% else %}
    RESPOND TYPE=command MSG="Pausing nexusp backend for external spool (FLY-LLL Plus)..."
    RUN_SHELL_COMMAND CMD=nexusp_switch_cmd PARAMS="off"
  {% endif %}

[gcode_macro NEXUSP_ON_CFS]
description: Start Creality nexusp backend for CFS-C multi-material printing
gcode:
  {% if printer.idle_timeout.state == "Printing" %}
    {action_raise_error("Cannot switch nexusp while a print is active!")}
  {% else %}
    RESPOND TYPE=command MSG="Starting nexusp backend for CFS-C..."
    RUN_SHELL_COMMAND CMD=nexusp_switch_cmd PARAMS="on"
  {% endif %}

[gcode_macro TOGGLE_NEXUSP]
description: Toggle Creality nexusp backend between External Spool and CFS-C
gcode:
  {% if printer.idle_timeout.state == "Printing" %}
    {action_raise_error("Cannot toggle nexusp while a print is active!")}
  {% else %}
    RUN_SHELL_COMMAND CMD=nexusp_switch_cmd PARAMS="toggle"
  {% endif %}

[gcode_macro NEXUSP_STATUS]
description: Show current nexusp backend state and FLY-LLL Plus (PD7) sensor status
gcode:
  {% set lll_detected = printer["filament_switch_sensor lll_plus_sensor"].filament_detected %}
  RESPOND TYPE=command MSG="FLY-LLL Plus Sensor (PD7): {'FILAMENT DETECTED' if lll_detected else 'EMPTY / NOT DETECTED'}"
  RUN_SHELL_COMMAND CMD=nexusp_switch_cmd PARAMS="status"
