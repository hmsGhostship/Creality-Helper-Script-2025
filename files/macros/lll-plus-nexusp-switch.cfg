[gcode_shell_command nexusp_switch_cmd]
command: sh /usr/data/helper-script/scripts/lll_nexusp_guard.sh
timeout: 110.0
verbose: True

[gcode_macro LLL_EXTERNAL_SPOOL_READY_SOUND]
description: 4-tone startup fanfare indicating External Spool (FLY-LLL Plus) mode with nexusp paused
gcode:
  {% if printer.print_stats.state != "printing" %}
    SET_STEPPER_ENABLE STEPPER=stepper_x enable=1
    SET_STEPPER_ENABLE STEPPER=stepper_y enable=1
    G4 P250
    MUSIC M=5 h=1 T=150
    G4 P250
    MUSIC M=5 h=1 T=160
    G4 P80
    MUSIC M=6 h=1 T=160
    G4 P80
    MUSIC M=5 h=1 T=160
    G4 P80
    MUSIC M=6 h=1 T=320
    G4 P350
    M84
  {% endif %}

[delayed_gcode _LLL_BOOT_NEXUSP_EVAL]
initial_duration: 1.5
gcode:
  QUERY_FILAMENT_SENSOR SENSOR=lll_plus_sensor
  G4 P150
  {% if printer["filament_switch_sensor lll_plus_sensor"].filament_detected %}
    RESPOND TYPE=command MSG="🧵 FLY-LLL Plus (PD7): FILAMENT DETECTED at boot -> Keeping nexusp PAUSED!"
    RUN_SHELL_COMMAND CMD=nexusp_switch_cmd PARAMS="boot-lock"
    LLL_EXTERNAL_SPOOL_READY_SOUND
  {% else %}
    RESPOND TYPE=command MSG="📦 FLY-LLL Plus (PD7): EMPTY at boot -> Starting nexusp for CFS-C..."
    RUN_SHELL_COMMAND CMD=nexusp_switch_cmd PARAMS="boot-release"
  {% endif %}

[gcode_macro NEXUSP_OFF_EXTERNAL_SPOOL]
description: Heat nozzle & retract loaded CFS-C filament (if any), verify T1.filament=None, then pause nexusp
gcode:
  {% if printer.idle_timeout.state == "Printing" %}
    {action_raise_error("Cannot switch nexusp while a print is active!")}
  {% else %}
    QUERY_FILAMENT_SENSOR SENSOR=filament_sensor
    QUERY_FILAMENT_SENSOR SENSOR=lll_plus_sensor
    G4 P150
    {% if printer["filament_switch_sensor filament_sensor"].filament_detected and not printer["filament_switch_sensor lll_plus_sensor"].filament_detected %}
      {% set retract_temp = [params.TEMP|default(240)|int, printer.extruder.temperature|int]|max %}
      RESPOND TYPE=command MSG="🔥 Holding nozzle at {retract_temp}C & running BOX_RETRUDE_MATERIAL..."
      M104 S{retract_temp}
      {% if printer.extruder.temperature < (retract_temp - 5) %}
        M109 S{retract_temp}
      {% endif %}
      BOX_RETRUDE_MATERIAL
      M104 S0
      RUN_SHELL_COMMAND CMD=nexusp_switch_cmd PARAMS="off-after-retract"
    {% else %}
      RESPOND TYPE=command MSG="Pausing nexusp backend for external spool (FLY-LLL Plus)..."
      RUN_SHELL_COMMAND CMD=nexusp_switch_cmd PARAMS="off"
    {% endif %}
    LLL_EXTERNAL_SPOOL_READY_SOUND
  {% endif %}

[gcode_macro NEXUSP_ON_CFS]
description: Start Creality nexusp backend for CFS-C multi-material printing (blocked if LLL Plus has filament)
gcode:
  QUERY_FILAMENT_SENSOR SENSOR=lll_plus_sensor
  G4 P100
  {% if printer.idle_timeout.state == "Printing" %}
    {action_raise_error("Cannot switch nexusp while a print is active!")}
  {% elif printer["filament_switch_sensor lll_plus_sensor"].filament_detected %}
    {action_raise_error("BLOCKED: Filament is still inserted in FLY-LLL Plus (PD7)! Remove external filament first before starting CFS-C.")}
  {% else %}
    RESPOND TYPE=command MSG="Starting nexusp backend for CFS-C..."
    RUN_SHELL_COMMAND CMD=nexusp_switch_cmd PARAMS="on"
  {% endif %}

[gcode_macro TOGGLE_NEXUSP]
description: Toggle Creality nexusp backend between External Spool and CFS-C
gcode:
  {% if printer.idle_timeout.state == "Printing" %}
    {action_raise_error("Cannot toggle nexusp while a print is active!")}
  {% else %}
    {% if printer["filament_switch_sensor filament_sensor"].filament_detected and not printer["filament_switch_sensor lll_plus_sensor"].filament_detected %}
      NEXUSP_OFF_EXTERNAL_SPOOL
    {% else %}
      RUN_SHELL_COMMAND CMD=nexusp_switch_cmd PARAMS="toggle"
    {% endif %}
  {% endif %}

[gcode_macro NEXUSP_STATUS]
description: Show current nexusp backend state and FLY-LLL Plus (PD7) sensor status
gcode:
  {% set lll_detected = printer["filament_switch_sensor lll_plus_sensor"].filament_detected %}
  RESPOND TYPE=command MSG="FLY-LLL Plus Sensor (PD7): {'FILAMENT DETECTED' if lll_detected else 'EMPTY / NOT DETECTED'}"
  RUN_SHELL_COMMAND CMD=nexusp_switch_cmd PARAMS="status"
