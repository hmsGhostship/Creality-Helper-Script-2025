########################################
# Helper-Script OTA State Backup Macro
########################################

[gcode_shell_command backup_ota_state]
command: sh /usr/data/helper-script/scripts/ota_state_backup.sh --auto
timeout: 60.0
verbose: True

[gcode_macro BACKUP_OTA_STATE]
description: Create an OTA-safe Helper-Script state backup
gcode:
  {% if printer.idle_timeout.state == "Printing" %}
    {action_raise_error("Cannot run BACKUP_OTA_STATE while a print is active!")}
  {% else %}
    RESPOND TYPE=command MSG="Starting OTA-safe Helper-Script state backup..."
    RUN_SHELL_COMMAND CMD=backup_ota_state
  {% endif %}
