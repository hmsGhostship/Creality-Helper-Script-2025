[gcode_shell_command backup_ota_state_cmd]
command: sh /usr/data/helper-script/scripts/ota_state_backup.sh --auto
timeout: 60.0
verbose: True

[gcode_shell_command check_ota_usb_cmd]
command: sh /usr/data/helper-script/scripts/ota_state_backup.sh --check-usb
timeout: 5.0
verbose: False

[gcode_macro BACKUP_OTA_STATE]
description: Save an OTA-safe Helper-Script state snapshot (with USB prompt if missing)
gcode:
  {% set force = params.FORCE|default(0)|int %}
  {% if force == 1 %}
    RESPOND TYPE=command MSG="action:prompt_end"
    RESPOND MSG="Starting Helper-Script OTA State Backup..."
    RUN_SHELL_COMMAND CMD=backup_ota_state_cmd
  {% else %}
    RESPOND TYPE=command MSG="action:prompt_begin OTA State Backup - USB Check"
    RESPOND TYPE=command MSG="action:prompt_text If no USB drive is plugged in yet: plug it in now to also save a USB copy (or save internally to /usr/data only)."
    RESPOND TYPE=command MSG="action:prompt_button Save Now (with USB if plugged in)|BACKUP_OTA_STATE FORCE=1|primary"
    RESPOND TYPE=command MSG="action:prompt_button Internal Only (/usr/data)|BACKUP_OTA_STATE FORCE=1|secondary"
    RESPOND TYPE=command MSG="action:prompt_footer_button Cancel|RESPOND TYPE=command MSG=action:prompt_end|error"
    RESPOND TYPE=command MSG="action:prompt_show"
  {% endif %}
