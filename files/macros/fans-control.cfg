########################################
# Fans Control (K1C 2025 Edition)
########################################

[respond]

[delayed_gcode CHAMBER_TEMP_LOOP]
initial_duration: 2.0
gcode:
  {% set target = printer["gcode_macro M141"].target_temp|float %}
  {% if target > 0 and "temperature_sensor chassis" in printer %}
    {% set current = printer["temperature_sensor chassis"].temperature|float %}
    {% if current > (target + 1.0) %}
      SET_FAN_SPEED FAN=chassis_fan SPEED=1.0
    {% elif current < (target - 1.0) %}
      SET_FAN_SPEED FAN=chassis_fan SPEED=0.0
    {% endif %}
  {% endif %}
  UPDATE_DELAYED_GCODE ID=CHAMBER_TEMP_LOOP DURATION=5.0


[gcode_macro M141]
description: Set Chamber Temperature with slicers
variable_target_temp: 0.0
gcode:
  {% set s = params.S|default(0)|float %}
  SET_GCODE_VARIABLE MACRO=M141 VARIABLE=target_temp VALUE={s}
  {% if s <= 0 %}
    SET_FAN_SPEED FAN=chassis_fan SPEED=0.0
    RESPOND TYPE=command MSG="Chamber temperature control disabled."
  {% else %}
    RESPOND TYPE=command MSG="Chamber target temperature set to {s}C."
  {% endif %}


[gcode_macro M191]
description: Wait for Chamber Temperature to heat up
gcode:
  {% set s = params.S|default(0)|float %}
  M141 S{s}
  {% if s > 0 and "temperature_sensor chassis" in printer %}
    {% set chamber_temp = printer["temperature_sensor chassis"].temperature|float %}
    {% if s > chamber_temp and s <= 90 %}
      M140 S100
      RESPOND TYPE=command MSG="Waiting for the bed to heat up the chamber ({s}C)..."
      TEMPERATURE_WAIT SENSOR="temperature_sensor chassis" MINIMUM={s-1}
      RESPOND TYPE=command MSG="Chamber target temperature reached: {s}C"
    {% endif %}
  {% endif %}


[gcode_macro M106]
description: Control Part (P0), Side (P2) and Chamber (P1/P3) Fans
gcode:
  {% set fan = params.P|default(0)|int %}
  {% set raw = params.S|default(255)|float %}
  {% set speed = [1.0, [0.0, raw / 255.0]|max]|min %}
  {% if fan == 0 %}
    SET_FAN_SPEED FAN=model_fan SPEED={speed}
  {% elif fan == 2 %}
    SET_FAN_SPEED FAN=side_fan SPEED={speed}
  {% elif fan == 1 or fan == 3 %}
    SET_FAN_SPEED FAN=chassis_fan SPEED={speed}
  {% endif %}


[gcode_macro M107]
description: Turn off Part (P0), Side (P2), Chamber (P1/P3) or all fans
gcode:
  {% if params.P is defined %}
    {% set fan = params.P|int %}
    {% if fan == 0 %}
      SET_FAN_SPEED FAN=model_fan SPEED=0.0
    {% elif fan == 2 %}
      SET_FAN_SPEED FAN=side_fan SPEED=0.0
    {% elif fan == 1 or fan == 3 %}
      SET_FAN_SPEED FAN=chassis_fan SPEED=0.0
    {% endif %}
  {% else %}
    SET_FAN_SPEED FAN=model_fan SPEED=0.0
    SET_FAN_SPEED FAN=side_fan SPEED=0.0
    SET_FAN_SPEED FAN=chassis_fan SPEED=0.0
  {% endif %}
