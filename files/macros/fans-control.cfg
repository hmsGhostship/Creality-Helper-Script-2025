########################################
# Fans Control (K1C 2025 Edition)
########################################

[respond]

[delayed_gcode CHAMBER_TEMP_LOOP]
initial_duration: 2.0
gcode:
  {% set target = printer["gcode_macro M141"].target_temp|float %}
  {% if target > 0 and "temperature_sensor chassis" in printer %}
    {% set current = printer["temperature_sensor chassis"].temperature|float %}
    {% if current > (target + 1.0) %}
      SET_FAN_SPEED FAN=chassis_fan SPEED=1.0
    {% elif current < (target - 1.0) %}
      SET_FAN_SPEED FAN=chassis_fan SPEED=0.0
    {% endif %}
  {% endif %}
  UPDATE_DELAYED_GCODE ID=CHAMBER_TEMP_LOOP DURATION=5.0


[gcode_macro M141]
description: Chamber Temp Control (Usage: M141 S<temp>, S0=Off)
variable_target_temp: 0.0
gcode:
  {% set s = params.S|default(0)|float %}
  SET_GCODE_VARIABLE MACRO=M141 VARIABLE=target_temp VALUE={s}
  {% if s <= 0 %}
    SET_FAN_SPEED FAN=chassis_fan SPEED=0.0
    RESPOND TYPE=command MSG="Chamber Temp Control: OFF (chassis_fan stopped). Use M141 S45 to set target."
  {% else %}
    RESPOND TYPE=command MSG="Chamber Temp Control: Target set to {s}C (regulated via chassis_fan)."
  {% endif %}


[gcode_macro M191]
description: Heat & Wait for Chamber Temp (Usage: M191 S<temp>)
gcode:
  {% set s = params.S|default(0)|float %}
  M141 S{s}
  {% if s > 0 and "temperature_sensor chassis" in printer %}
    {% set chamber_temp = printer["temperature_sensor chassis"].temperature|float %}
    {% if s > chamber_temp and s <= 90 %}
      M140 S100
      RESPOND TYPE=command MSG="Chamber Temp Control: Heating bed to reach {s}C in chamber..."
      TEMPERATURE_WAIT SENSOR="temperature_sensor chassis" MINIMUM={s-1}
      RESPOND TYPE=command MSG="Chamber Temp Control: Target {s}C reached."
    {% endif %}
  {% endif %}
