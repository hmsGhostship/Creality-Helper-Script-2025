[gcode_shell_command HELPER_SCRIPT_BACKUP]
command: sh /usr/data/helper-script/helper_git_backup.sh
timeout: 90.0
verbose: True

[gcode_macro BACKUP_HELPER_SCRIPT]
description: Sichert die angepassten Helper-Scripte mit optionaler Nachricht auf GitHub
gcode:
    {% if 'MSG' in params %}
        {% set msg = params.MSG | string %}
        RUN_SHELL_COMMAND CMD=HELPER_SCRIPT_BACKUP PARAMS="{msg}"
    {% else %}
        RUN_SHELL_COMMAND CMD=HELPER_SCRIPT_BACKUP
    {% endif %}
