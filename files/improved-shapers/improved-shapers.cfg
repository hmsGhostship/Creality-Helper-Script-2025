########################################
# Improved Shapers Configurations (K1C 2025 Low-RAM SVG Edition)
########################################

[respond]

[gcode_shell_command resonance_graph]
command: /usr/data/moonraker/moonraker-env/bin/python /usr/data/printer_data/config/Helper-Script/improved-shapers/scripts/generate_shaper_svg.py
timeout: 600.0
verbose: False

[gcode_shell_command belts_graph]
command: /usr/data/moonraker/moonraker-env/bin/python /usr/data/printer_data/config/Helper-Script/improved-shapers/scripts/generate_shaper_svg.py
timeout: 600.0
verbose: False

[gcode_shell_command delete_graph]
command: sh /usr/data/helper-script/files/improved-shapers/delete_graph.sh
timeout: 600.0
verbose: False

[gcode_shell_command delete_csv]
command: sh /usr/data/helper-script/files/improved-shapers/delete_csv.sh
timeout: 600.0
verbose: False

[gcode_macro INPUT_SHAPER_CALIBRATION]
description: Measure X and Y Axis Resonances and Save values
gcode:
  {% if "temperature_fan main_board" in printer["configfile"].config %}
    SET_TEMPERATURE_FAN_TARGET TEMPERATURE_FAN=main_board TARGET=35
  {% endif %}
  {% if printer.toolhead.homed_axes != "xyz" %}
    RESPOND TYPE=command MSG="Homing..."
    G28
  {% endif %}
  RESPOND TYPE=command MSG="Measuring X and Y Resonances..."
  SHAPER_CALIBRATE
  M400
  {% if "temperature_fan main_board" in printer["configfile"].config %}
    SET_TEMPERATURE_FAN_TARGET TEMPERATURE_FAN=main_board TARGET=60
  {% endif %}
  RUN_SHELL_COMMAND CMD=delete_csv
  RESPOND TYPE=command MSG="Input Shaper Calibration complete!"
  SAVE_CONFIG

[gcode_macro TEST_RESONANCES_GRAPHS]
description: Test X and Y Axis Resonances and Generate SVG Graphs (Async, no 60s timeout)
variable_x_svg: "/usr/data/printer_data/config/Helper-Script/improved-shapers/resonances_x.svg"
variable_y_svg: "/usr/data/printer_data/config/Helper-Script/improved-shapers/resonances_y.svg"
gcode:
  {% set x_svg = params.X_SVG|default("/usr/data/printer_data/config/Helper-Script/improved-shapers/resonances_x.svg") %}
  {% set y_svg = params.Y_SVG|default("/usr/data/printer_data/config/Helper-Script/improved-shapers/resonances_y.svg") %}
  SET_GCODE_VARIABLE MACRO=TEST_RESONANCES_GRAPHS VARIABLE=x_svg VALUE="'{x_svg}'"
  SET_GCODE_VARIABLE MACRO=TEST_RESONANCES_GRAPHS VARIABLE=y_svg VALUE="'{y_svg}'"
  RESPOND TYPE=command MSG="Starting background X/Y resonance test (~45s total)..."
  UPDATE_DELAYED_GCODE ID=_RUN_TEST_RESONANCES_GRAPHS DURATION=0.1

[delayed_gcode _RUN_TEST_RESONANCES_GRAPHS]
gcode:
  RUN_SHELL_COMMAND CMD=delete_graph
  RUN_SHELL_COMMAND CMD=delete_csv
  {% set x_svg = printer["gcode_macro TEST_RESONANCES_GRAPHS"].x_svg %}
  {% set y_svg = printer["gcode_macro TEST_RESONANCES_GRAPHS"].y_svg %}
  {% if "temperature_fan main_board" in printer["configfile"].config %}
    SET_TEMPERATURE_FAN_TARGET TEMPERATURE_FAN=main_board TARGET=35
  {% endif %}
  {% if printer.toolhead.homed_axes != "xyz" %}
    RESPOND TYPE=command MSG="Homing..."
    G28
  {% endif %}
  RESPOND TYPE=command MSG="Testing X Resonances..."
  TEST_RESONANCES OUTPUT=raw_data AXIS=X NAME=x FREQ_START=15 FREQ_END=100 HZ_PER_SEC=2
  M400
  RESPOND TYPE=command MSG="Generating X SVG Spectrum..."
  RUN_SHELL_COMMAND CMD=resonance_graph PARAMS="/tmp/raw_data_*x.csv -o {x_svg}"
  RESPOND TYPE=command MSG="X Graph ready: {x_svg}"
  RESPOND TYPE=command MSG="Testing Y Resonances..."
  TEST_RESONANCES OUTPUT=raw_data AXIS=Y NAME=y FREQ_START=15 FREQ_END=100 HZ_PER_SEC=2
  M400
  RESPOND TYPE=command MSG="Generating Y SVG Spectrum..."
  RUN_SHELL_COMMAND CMD=resonance_graph PARAMS="/tmp/raw_data_*y.csv -o {y_svg}"
  RESPOND TYPE=command MSG="Y Graph ready: {y_svg}"
  {% if "temperature_fan main_board" in printer["configfile"].config %}
    SET_TEMPERATURE_FAN_TARGET TEMPERATURE_FAN=main_board TARGET=60
  {% endif %}
  RESPOND TYPE=command MSG="Resonances Test complete! Open Machine -> config -> Helper-Script -> improved-shapers."

[gcode_macro BELTS_SHAPER_CALIBRATION]
description: Analyze and compare individual CoreXY belts frequency profiles (Async SVG)
variable_min_freq: 5.0
variable_max_freq: 133.33
variable_hz_per_sec: 3.0
variable_svg_out: "/usr/data/printer_data/config/Helper-Script/improved-shapers/belts_calibration.svg"
gcode:
  SET_GCODE_VARIABLE MACRO=BELTS_SHAPER_CALIBRATION VARIABLE=min_freq VALUE={params.FREQ_START|default(5)|float}
  SET_GCODE_VARIABLE MACRO=BELTS_SHAPER_CALIBRATION VARIABLE=max_freq VALUE={params.FREQ_END|default(133.33)|float}
  SET_GCODE_VARIABLE MACRO=BELTS_SHAPER_CALIBRATION VARIABLE=hz_per_sec VALUE={params.HZ_PER_SEC|default(2)|float}
  SET_GCODE_VARIABLE MACRO=BELTS_SHAPER_CALIBRATION VARIABLE=svg_out VALUE="'{params.SVG_OUT_PATH|default("/usr/data/printer_data/config/Helper-Script/improved-shapers/belts_calibration.svg")}'"
  RESPOND TYPE=command MSG="Starting background CoreXY belts calibration (~45s total)..."
  UPDATE_DELAYED_GCODE ID=_RUN_BELTS_SHAPER_CALIBRATION DURATION=0.1

[delayed_gcode _RUN_BELTS_SHAPER_CALIBRATION]
gcode:
  RUN_SHELL_COMMAND CMD=delete_graph
  RUN_SHELL_COMMAND CMD=delete_csv
  {% set min_freq = printer["gcode_macro BELTS_SHAPER_CALIBRATION"].min_freq|float %}
  {% set max_freq = printer["gcode_macro BELTS_SHAPER_CALIBRATION"].max_freq|float %}
  {% set hz_per_sec = printer["gcode_macro BELTS_SHAPER_CALIBRATION"].hz_per_sec|float %}
  {% set svg_out = printer["gcode_macro BELTS_SHAPER_CALIBRATION"].svg_out %}
  {% if "temperature_fan main_board" in printer["configfile"].config %}
    SET_TEMPERATURE_FAN_TARGET TEMPERATURE_FAN=main_board TARGET=35
  {% endif %}
  {% if printer.toolhead.homed_axes != "xyz" %}
    RESPOND TYPE=command MSG="Homing..."
    G28
  {% endif %}
  TEST_RESONANCES AXIS=1,1 OUTPUT=raw_data NAME=b FREQ_START={min_freq} FREQ_END={max_freq} HZ_PER_SEC={hz_per_sec}
  M400
  TEST_RESONANCES AXIS=1,-1 OUTPUT=raw_data NAME=a FREQ_START={min_freq} FREQ_END={max_freq} HZ_PER_SEC={hz_per_sec}
  M400
  RESPOND TYPE=command MSG="Generating Belts SVG Frequency Spectrum..."
  RUN_SHELL_COMMAND CMD=belts_graph PARAMS="-o {svg_out} /tmp/raw_data_axis=1.000,-1.000_a.csv /tmp/raw_data_axis=1.000,1.000_b.csv"
  RESPOND TYPE=command MSG="Belts Graph ready: {svg_out}"
  {% if "temperature_fan main_board" in printer["configfile"].config %}
    SET_TEMPERATURE_FAN_TARGET TEMPERATURE_FAN=main_board TARGET=60
  {% endif %}
  RESPOND TYPE=command MSG="Belts Shaper Calibration complete!"

[gcode_macro EXCITATE_AXIS_AT_FREQ]
description: Maintain a specified excitation frequency to diagnose a vibration source
gcode:
  {% set frequency = params.FREQUENCY|default(25)|int %}
  {% set time = params.TIME|default(10)|int %}
  {% set axis = params.AXIS|default("x")|string|lower %}
  {% if axis not in ["x", "y", "a", "b"] %}
    { action_raise_error("AXIS selection is invalid. Should be either x, y, a or b!") }
  {% endif %}
  {% if axis == "a" %}
    {% set axis = "1,-1" %}
  {% elif axis == "b" %}
    {% set axis = "1,1" %}
  {% endif %}
  {% if printer.toolhead.homed_axes != "xyz" %}
    RESPOND TYPE=command MSG="Homing..."
    G28
  {% endif %}
  TEST_RESONANCES OUTPUT=raw_data AXIS={axis} FREQ_START={frequency-1} FREQ_END={frequency+1} HZ_PER_SEC={1/(time/3)}
  M400
