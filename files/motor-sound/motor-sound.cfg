[gcode_macro BEEP]
gcode:
    # Check whether the printer is currently actively printing
    {% if printer.print_stats.state != "printing" %}
        # Accept duration parameter P (in ms), default to 150ms if not specified
        {% set P = params.P|default(150)|int %}
        
        # Enable X and Y steppers so they can generate sound waves
        SET_STEPPER_ENABLE STEPPER=stepper_x enable=1
        SET_STEPPER_ENABLE STEPPER=stepper_y enable=1
        G4 P50 ; Short dwell to let drivers stabilize
        
        # Play the tone using the motors (Note M=5 is a solid mid-range beep)
        MUSIC M=5 h=1 T={P}
        
        # Dwell slightly then turn off steppers immediately to prevent overheating
        G4 P100
        M84
    {% else %}
        {action_respond_info("BEEP unterdrückt, da ein Druck aktiv ist (Schutz vor M84/Blobs)!")}
    {% endif %}

[gcode_macro ALARM_MUSIC]
gcode:
    # Check whether the printer is currently actively printing
    {% if printer.print_stats.state != "printing" %}
        # Enable X and Y steppers so they can generate sound waves
        SET_STEPPER_ENABLE STEPPER=stepper_x enable=1
        SET_STEPPER_ENABLE STEPPER=stepper_y enable=1
        G4 P200                 ; Short dwell to let drivers stabilize
        
        # Alarm sequence: Triple high-low tone pattern
        MUSIC M=8 h=1 T=150     ; High pitch
        MUSIC M=5 h=1 T=150     ; Low pitch
        G4 P100                 ; Short pause
        
        MUSIC M=8 h=1 T=150     ; High pitch
        MUSIC M=5 h=1 T=150     ; Low pitch
        G4 P100                 ; Short pause
        
        MUSIC M=8 h=1 T=300     ; Final longer high pitch
        
        # Dwell slightly then turn off steppers immediately to prevent overheating
        G4 P500                 ; Post-tone stabilization delay
        M84                     ; Disable steppers
    {% else %}
        {action_respond_info("ALARM_MUSIC unterdrückt, da ein Druck aktiv ist (Schutz vor M84/Blobs)!")}
    {% endif %}

[gcode_macro SILENT_NIGHT]
description: Plays the first 8 bars of Silent Night in strict 6/8 time
gcode:
    {% if printer.print_stats.state != "printing" %}
        SET_STEPPER_ENABLE STEPPER=stepper_x enable=1
        SET_STEPPER_ENABLE STEPPER=stepper_y enable=1
        G4 P200

        ; Takt 1 (6/8): Sti-hil-le Nacht -> G4 (3/8) - A4 (1/8) - G4 (2/8)
        MUSIC M=5 h=1 T=720
        G4 P30
        MUSIC M=6 h=1 T=220
        G4 P30
        MUSIC M=5 h=1 T=470
        G4 P30

        ; Takt 2 (6/8): hei-li-ge Nacht -> E4 (6/8 gehalten)
        MUSIC M=3 h=1 T=1450
        G4 P50

        ; Takt 3 (6/8): Al-les schlaeft -> G4 (3/8) - A4 (1/8) - G4 (2/8)
        MUSIC M=5 h=1 T=720
        G4 P30
        MUSIC M=6 h=1 T=220
        G4 P30
        MUSIC M=5 h=1 T=470
        G4 P30

        ; Takt 4 (6/8): ein-sam wacht -> E4 (6/8 gehalten)
        MUSIC M=3 h=1 T=1450
        G4 P50

        ; Takt 5 (6/8): Nur das trau-te -> D5 (4/8) - D5 (2/8)
        MUSIC M=2 h=2 T=950
        G4 P50
        MUSIC M=2 h=2 T=470
        G4 P30

        ; Takt 6 (6/8): hoch-hei-li-ge Paar -> H4 (6/8 gehalten)
        MUSIC M=7 h=1 T=1450
        G4 P50

        ; Takt 7 (6/8): Hol-der Kna-be im -> C5 (4/8) - C5 (2/8)
        MUSIC M=1 h=2 T=950
        G4 P50
        MUSIC M=1 h=2 T=470
        G4 P30

        ; Takt 8 (6/8): lo-cki-gen Haar -> G4 (6/8 gehalten)
        MUSIC M=5 h=1 T=1450
        G4 P200

        M84
    {% else %}
        {action_respond_info("SILENT_NIGHT suppressed while printing!")}
    {% endif %}
