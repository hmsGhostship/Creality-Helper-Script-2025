[gcode_macro BEEP]
gcode:
    # Accept duration parameter P (in ms), default to 150ms if not specified
    {% set P = params.P|default(150)|int %}
    
    # Enable X and Y steppers so they can generate sound waves
    SET_STEPPER_ENABLE STEPPER=stepper_x enable=1
    SET_STEPPER_ENABLE STEPPER=stepper_y enable=1
    G4 P50 ; Short dwell to let drivers stabilize
    
    # Play the tone using the motors (Note M=5 is a solid mid-range beep)
    MUSIC M=5 h=1 T={P}
    
    # Dwell slightly then turn off steppers immediately to prevent overheating
    G4 P100
    M84

[gcode_macro ALARM_MUSIC]
gcode:
    # Enable X and Y steppers so they can generate sound waves
    SET_STEPPER_ENABLE STEPPER=stepper_x enable=1
    SET_STEPPER_ENABLE STEPPER=stepper_y enable=1
    G4 P200                 ; Short dwell to let drivers stabilize
    
    # Alarm sequence: Triple high-low tone pattern
    MUSIC M=8 h=1 T=150     ; High pitch
    MUSIC M=5 h=1 T=150     ; Low pitch
    G4 P100                 ; Short pause
    
    MUSIC M=8 h=1 T=150     ; High pitch
    MUSIC M=5 h=1 T=150     ; Low pitch
    G4 P100                 ; Short pause
    
    MUSIC M=8 h=1 T=300     ; Final longer high pitch
    
    # Dwell slightly then turn off steppers immediately to prevent overheating
    G4 P500                 ; Post-tone stabilization delay
    M84                     ; Disable steppers
