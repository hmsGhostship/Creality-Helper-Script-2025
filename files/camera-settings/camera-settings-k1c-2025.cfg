########################################
# K1 2025/2026 Camera Settings Control
# Autonomous Hardware Capability Detector
# Macro version 5.0 -2025 - Clean International UI
########################################

[gcode_shell_command v4l2-ctl]
command: v4l2-ctl
timeout: 5.0
verbose: True

# ====================================================================
# AUTONOMOUS HARDWARE DETECTOR & LIVE ROUTING STATUS
# ====================================================================

[gcode_macro _DETECT_ACTIVE_CAM_PORT]
variable_ctrl_port: "-1"
gcode:
    # Initial scan during boot
    {% if ctrl_port == "-1" %}
        # Sets port 0 (your USB cam) as a stable default startup channel
        SET_GCODE_VARIABLE MACRO=_DETECT_ACTIVE_CAM_PORT VARIABLE=ctrl_port VALUE='"0"'
    {% endif %}

[gcode_macro CAM_CURRENT_STATUS]
description: Displays actively targeted camera device routing in the Klipper console
gcode:
    {% set current = printer["gcode_macro _DETECT_ACTIVE_CAM_PORT"].ctrl_port|int %}
    {% if current == 0 %}
        {action_respond_info("🎬 CAMERA CONTROL ACTIVE: [► Chassis Cam /dev/video0] | USB Camera sleeping")}
    {% elif current == 2 %}
        {action_respond_info("🎬 CAMERA CONTROL ACTIVE: [► USB Camera /dev/video2] | Chassis Cam sleeping")}
    {% else %}
        {action_respond_info("⚠️ CAMERA CONTROL ERROR: Invalid hardware port interface (/dev/video" ~ current ~ ")")}
    {% endif %}

[delayed_gcode INIT_CAM_CONTROLS]
initial_duration: 3.0
gcode:
    _DETECT_ACTIVE_CAM_PORT
    M117 Camera Routing Active
    # Invokes the status cleanly via the actual command name, following a short pause
    UPDATE_DELAYED_GCODE ID=_CAM_SETTINGS_STATUS_INTERNAL_DELAYED DURATION=0.5

[delayed_gcode _CAM_SETTINGS_STATUS_INTERNAL_DELAYED]
gcode:
    # FIXED: No more erroneous printer["..."] call; now uses the actual command name!
    CAM_CURRENT_STATUS


# ====================================================================
# DYNAMIC DEVICE TOGGLE (FOR DUAL CAMERA SETUPS)
# ====================================================================

[gcode_macro CAM_SELECT_DEVICE]
description: Dynamically toggle camera routing between Chassis (0) and USB (2) with hardware guard
# These flags are supplied by the system fully automatically during boot!t!
variable_has_video0: True
variable_has_video2: True
gcode:
    {% set current = printer["gcode_macro _DETECT_ACTIVE_CAM_PORT"].ctrl_port|int %}

    {% if params.DEVICE is defined %}
        # ---- Manual force command via parameter ----
        {% set target = params.DEVICE|int %}
        {% if (target == 0 and has_video0) or (target == 2 and has_video2) %}
            SET_GCODE_VARIABLE MACRO=_DETECT_ACTIVE_CAM_PORT VARIABLE=ctrl_port VALUE='"{target}"'
            CAM_CURRENT_STATUS
        {% else %}
            {action_respond_info("⚠️ CAMERA CONTROL: Port /dev/video" ~ target ~ " ist aktuell nicht aktiv im System! Befehl ignoriert.")}
        {% endif %}
    {% else %}
        # ---- Intelligent Toggle Switch (Toggle Button) ----
        {% if has_video0 and has_video2 %}
            # BOTH cameras are active -> Normal, seamless switching is possible!
            {% set next = 2 if current == 0 else 0 %}
            SET_GCODE_VARIABLE MACRO=_DETECT_ACTIVE_CAM_PORT VARIABLE=ctrl_port VALUE='"{next}"'
            CAM_CURRENT_STATUS
        {% else %}
            # ONLY ONE camera is active -> Any input/click is coldly ignored!
            {action_respond_info("ℹ️ CAMERA CONTROL: Nur ein Kamera-Fix aktiv im System. Umschalten blockiert, um Fehlrouting zu verhindern.")}
            
            # Security fix: Forces the system to use the only actually running port
            {% if has_video2 and not has_video0 %}
                SET_GCODE_VARIABLE MACRO=_DETECT_ACTIVE_CAM_PORT VARIABLE=ctrl_port VALUE='"2"'
            {% else %}
                SET_GCODE_VARIABLE MACRO=_DETECT_ACTIVE_CAM_PORT VARIABLE=ctrl_port VALUE='"0"'
            {% endif %}
            CAM_CURRENT_STATUS
        {% endif %}
    {% endif %}

# ====================================================================
# IMAGE CONTROLS (ROUTED AUTOMATICALLY TO THE VALID HARDWARE INTERFACE)
# ====================================================================

[gcode_macro CAM_SETTINGS]
description: Displays all available hardware control fields in the console
gcode:
    {% set dev = printer["gcode_macro _DETECT_ACTIVE_CAM_PORT"].ctrl_port %}
    RUN_SHELL_COMMAND CMD=v4l2-ctl PARAMS="-d /dev/video{dev} --list-ctrls"

[gcode_macro CAM_BRIGHTNESS]
description: Adjust camera hardware brightness (min=0 / max=255)
gcode:
    {% set dev = printer["gcode_macro _DETECT_ACTIVE_CAM_PORT"].ctrl_port %}
    {% set brightness = params.BRIGHTNESS|default(128) %}
    RUN_SHELL_COMMAND CMD=v4l2-ctl PARAMS="-d /dev/video{dev} --set-ctrl brightness="{brightness}

[gcode_macro CAM_CONTRAST]
description: Adjust camera hardware contrast (min=0 / max=255)
gcode:
    {% set dev = printer["gcode_macro _DETECT_ACTIVE_CAM_PORT"].ctrl_port %}
    {% set contrast = params.CONTRAST|default(128) %}
    RUN_SHELL_COMMAND CMD=v4l2-ctl PARAMS="-d /dev/video{dev} --set-ctrl contrast="{contrast}

[gcode_macro CAM_SATURATION]
description: Adjust camera hardware color saturation (min=0 / max=255)
gcode:
    {% set dev = printer["gcode_macro _DETECT_ACTIVE_CAM_PORT"].ctrl_port %}
    {% set saturation = params.SATURATION|default(128) %}
    RUN_SHELL_COMMAND CMD=v4l2-ctl PARAMS="-d /dev/video{dev} --set-ctrl saturation="{saturation}

[gcode_macro CAM_GAIN]
description: Adjust camera sensor gain (min=0 / max=100)
gcode:
    {% set dev = printer["gcode_macro _DETECT_ACTIVE_CAM_PORT"].ctrl_port %}
    {% set gain = params.GAIN|default(5) %}
    RUN_SHELL_COMMAND CMD=v4l2-ctl PARAMS="-d /dev/video{dev} --set-ctrl gain="{gain}

[gcode_macro CAM_POWER_LINE_FREQUENCY]
description: Anti-Flicker Filter for LED lightning (disabled=0 / 50hz=1 / 60hz=2)
gcode:
    {% set dev = printer["gcode_macro _DETECT_ACTIVE_CAM_PORT"].ctrl_port %}
    {% set power_line_frequency = params.POWER_LINE_FREQUENCY|default(1) %}
    RUN_SHELL_COMMAND CMD=v4l2-ctl PARAMS="-d /dev/video{dev} --set-ctrl power_line_frequency="{power_line_frequency}

[gcode_macro CAM_WHITE_BALANCE_TEMPERATURE_AUTO]
description: Automatic white balance toggle (disable=0 / enable=1)
gcode:
    {% set dev = printer["gcode_macro _DETECT_ACTIVE_CAM_PORT"].ctrl_port %}
    {% set white_balance_temperature_auto = params.WHITE_BALANCE_TEMPERATURE_AUTO|default(1) %}
    RUN_SHELL_COMMAND CMD=v4l2-ctl PARAMS="-d /dev/video{dev} --set-ctrl white_balance_temperature_auto="{white_balance_temperature_auto}

[gcode_macro CAM_WHITE_BALANCE_TEMPERATURE]
description: Adjust manual white balance temperature (min=0 / max=255)
gcode:
    {% set dev = printer["gcode_macro _DETECT_ACTIVE_CAM_PORT"].ctrl_port %}
    {% set white_balance_temperature = params.WHITE_BALANCE_TEMPERATURE|default(128) %}
    RUN_SHELL_COMMAND CMD=v4l2-ctl PARAMS="-d /dev/video{dev} --set-ctrl white_balance_temperature="{white_balance_temperature}

[gcode_macro CAM_SHARPNESS]
description: Adjust image sharpness filters (min=0 / max=255)
gcode:
    {% set dev = printer["gcode_macro _DETECT_ACTIVE_CAM_PORT"].ctrl_port %}
    {% set sharpness = params.SHARPNESS|default(128) %}
    RUN_SHELL_COMMAND CMD=v4l2-ctl PARAMS="-d /dev/video{dev} --set-ctrl sharpness="{sharpness}

[gcode_macro CAM_EXPOSURE_AUTO]
description: Exposure calculation mode (auto=0 / manual=1)
gcode:
    {% set dev = printer["gcode_macro _DETECT_ACTIVE_CAM_PORT"].ctrl_port %}
    {% set exposure_auto = params.EXPOSURE_AUTO|default(0) %}
    RUN_SHELL_COMMAND CMD=v4l2-ctl PARAMS="-d /dev/video{dev} --set-ctrl exposure_auto="{exposure_auto}

[gcode_macro CAM_EXPOSURE_ABSOLUTE]
description: Adjust manual exposure time calculation (min=0 / max=6500)
gcode:
    {% set dev = printer["gcode_macro _DETECT_ACTIVE_CAM_PORT"].ctrl_port %}
    {% set exposure_absolute = params.EXPOSURE_ABSOLUTE|default(100) %}
    RUN_SHELL_COMMAND CMD=v4l2-ctl PARAMS="-d /dev/video{dev} --set-ctrl exposure_auto=1 --set-ctrl exposure_absolute="{exposure_absolute}
